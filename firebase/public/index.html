<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>프로호구 매니저</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#06160e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="프로호구">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE 덕아웃 옆 카드 테이블, 수집의 설렘과 전광판의 긴장감 (v1 톤 유지)
   IDEA 잔디 위에 펼친 연도별 선수카드 + 수동식 외야 전광판
   PICTURE 두 줄로 늘어선 오더 카드와 보직 표시, 옆에 배터리 궁합 막대
   COLOUR 잔디 초록 바탕, 흙색 클레이 포인트, 분필 흰색, 카드는 종이색 + 구단색
   TYPE Barlow Condensed(숫자) + IBM Plex Sans KR
   LAYOUT 상단 탭 / 라인업: 야수 줄(타순 9 + 벤치 5), 투수 줄(선발 5 → 중계 4, 셋업, 마무리), 아래 보유 카드 + 배터리 궁합 / 폰: 줄은 가로 스크롤 */
:root{--fh:"Barlow Condensed","IBM Plex Sans KR",sans-serif;--fb:"IBM Plex Sans KR",system-ui,sans-serif;color-scheme:light dark;--bg:light-dark(#1f6b45,#0b2b1d);--bg2:light-dark(#195a3a,#0f3626);--board:light-dark(#0d3a27,#06190f);--ink:#f3f7f1;--mute:light-dark(#d2e7d9,#a3c1af);--clay:#e07a45;--clay2:#c4602d;--line:rgba(255,255,255,.18);--paper:#fbfaf6;--pi:#1b1d1c;--gold:#ffd27a;--ok:#7fe0a3;--warn:#ffd27a;--bad:#ff8a7a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb);overflow-x:clip;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 60px,transparent 60px 120px)}
#app{max-width:1240px;margin:0 auto;padding:0 max(3vw,16px) 60px}
h1,h2,h3,.logo{font-family:var(--fh);font-weight:700;line-height:1.1;margin:0 0 12px;text-wrap:balance}
h2{font-size:24px}h3{font-size:19px;color:var(--mute)}
button{font:700 15px var(--fb);min-height:44px;padding:8px 16px;border-radius:10px;border:0;background:var(--clay);color:#fff;cursor:pointer}
button.ghost{background:rgba(0,0,0,.22);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,.slot:focus-visible,.bc:focus-visible,.cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:18px 0 12px;border-bottom:2px dashed var(--line)}
.logo{font-size:28px;margin:0;color:#fff;text-shadow:3px 3px 0 var(--clay2)}
.logo small{display:block;font:500 13px var(--fb);color:var(--mute);text-shadow:none;margin-top:4px}
.wallet{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.wallet span{background:var(--board);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav a{color:var(--ink);text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:700;background:rgba(0,0,0,.18);min-height:44px;display:flex;align-items:center}
nav a.on{background:var(--clay);color:#fff}
.subnav2{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 0}.subnav2 a{color:var(--ink);text-decoration:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center;border:1px solid rgba(255,255,255,.15)}.subnav2 a.on{background:rgba(255,255,255,.14);border-color:var(--gold);color:var(--gold)}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
.hint{min-height:1.6em;margin:6px 0 0;font-weight:700}.hint.on{color:var(--gold)}
.help{display:none}body.showhelp .help{display:block}body.showhelp .legend.help{display:flex}
#helpBtn[aria-pressed=true]{background:var(--gold);color:#3a2405}
.band{padding:22px 0;border-bottom:2px dashed var(--line)}
/* 덱 상태 바 */
.deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:10px;margin-top:16px}
.meter{background:var(--board);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.meter b{font-size:14px}.meter .v{float:right;font-weight:900;white-space:nowrap}
.track{position:relative;height:12px;background:rgba(255,255,255,.12);border-radius:6px;margin-top:8px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--clay);border-radius:6px}
.track u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.meter small{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.meter.over .track i{background:var(--bad)}
/* 라인업 */
.lu{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:18px;align-items:start}
.field{position:relative;aspect-ratio:1/0.86;border-radius:18px;overflow:hidden;background:var(--board)}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:clamp(74px,15%,112px);background:var(--paper);color:var(--pi);border-radius:9px;padding:0;border:0;min-height:0;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.35);overflow:hidden;font-weight:500}
.slot .ph{display:block;height:6px;background:var(--tc)}
.slot .nm{display:block;font:700 14px/1.2 var(--fb);padding:4px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .mt{display:flex;justify-content:space-between;gap:4px;font-size:12px;padding:0 6px 4px;color:#555}
.slot .pp{position:absolute;top:-1px;right:-1px;background:var(--pi);color:#fff;font:700 12px var(--fh);padding:2px 5px;border-radius:0 0 0 7px}
.slot.sel{outline:3px solid var(--gold);outline-offset:2px}
.fit-A .mt b{color:#147a42}.cell.g-D{background:#6b6b6b}.fit-B .mt b{color:#9a6a00}.fit-C .mt b{color:#b3261e}
.slot.empty{background:rgba(255,255,255,.15);color:var(--ink);border:2px dashed var(--line);box-shadow:none;text-align:center}
.side{display:grid;gap:16px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px}
.box h3{margin-bottom:8px}
ol.ord{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ord li{display:grid;grid-template-columns:2em 3.2em minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.16)}
.ord li .n{font:700 20px var(--fh);color:var(--gold)}
.ord .ps{font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:6px;text-align:center;padding:2px 0}
.ord .x{font-size:13px;color:var(--mute);white-space:nowrap}
.mv{min-height:36px;width:36px;padding:0;background:rgba(255,255,255,.1)}
.pit{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pit .slot{position:static;transform:none;width:auto}
.lbl{font-size:13px;color:var(--mute);margin:10px 0 4px;font-weight:700}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px;max-height:356px;overflow-y:auto;padding:4px 4px 8px;scrollbar-gutter:stable}
.card.slim .art{aspect-ratio:1}.card.slim .plate{display:grid;gap:0;padding:4px 6px}.card.slim .plate b{font-size:15px}.card.slim .plate span{font-size:11px}
.card.slim .ovr{font-size:20px}.card.slim .stars{font-size:7px;letter-spacing:-1.5px;margin-left:3px}.card.slim .tag{font-size:11px;padding:0 5px}
.facecrop{transform:scale(1.45);transform-origin:55% 18%}
.card .art,.oart{overflow:hidden;isolation:isolate}.card .art>img{z-index:1}.card .art>span{z-index:1}.card .plate{position:relative;z-index:2}.oart>i{z-index:1}.onm,.osub{position:relative;z-index:2}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:16px var(--fb);min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--board);color:var(--ink)}
/* 카드 */
.card{--tc:#444;position:relative;background:var(--paper);color:var(--pi);border-radius:12px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;border:3px solid var(--paper)}
.card.t-S{border-color:#c9ccd3}.card.t-L{border-color:#e2b23c}
.card .art{position:relative;aspect-ratio:4/3;background:var(--tc)}
.card .art svg{position:absolute;inset:0;width:100%;height:100%}
.stars{display:inline-block;vertical-align:middle;margin-left:4px;font:400 10px/1 sans-serif;color:var(--gold);letter-spacing:-1px;white-space:nowrap;font-style:normal}.cd .card .stars{font-size:13px}.ost{font:700 10px sans-serif;color:var(--gold);margin-left:3px;font-style:normal}
.card .ovr .cnd,.oovr .cnd{position:static;display:grid;place-items:center;flex:none;width:18px;height:18px;border-radius:50%;margin-right:3px;color:#fff;font-style:normal;text-shadow:none;box-shadow:0 1px 0 rgba(0,0,0,.35)}.oovr .cnd{width:14px;height:14px;margin-right:2px}.cnd svg{position:static!important;width:12px!important;height:12px!important;display:block}.oovr .cnd svg{width:10px!important;height:10px!important}
.cd5{background:#e8452c}.cd4{background:#f08a24}.cd3{background:#d9b21e}.cd2{background:#3f86d9}.cd1{background:#7a5bd6}
.card .ovr{position:absolute;top:6px;right:8px;display:flex;align-items:center;color:#fff;font:700 26px var(--fh);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.card .plate{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:6px 8px;background:var(--pi);color:#fff}
.card .plate b{font:700 17px var(--fh);display:flex;align-items:center;min-width:0}/* pool-name-fix: 카드 목록에선 이름이 먼저, 별은 남는 폭만 */.pool .card .plate b{font-size:15px;letter-spacing:-.3px}.pool .card .plate b em{flex:none;max-width:100%}.card .tag.tstar{padding:2px 6px;line-height:1}.card .tag.tstar .stars{margin-left:0;font-size:13px;letter-spacing:-1px}.onm{font-size:11.5px;letter-spacing:-.4px}.onm .oy{font-size:9.5px;opacity:.7;margin-right:1px}.pool .card .plate b .stars{flex:0 1 auto;overflow:hidden;min-width:0;letter-spacing:-2px}.card .plate b em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.card .plate b .stars{flex:none}
.card .plate span{font-size:12px;white-space:nowrap;color:#d6d6d6}
.card .st{padding:6px 8px 8px;display:grid;gap:2px}
.sr{display:grid;grid-template-columns:2.6em minmax(0,1fr) 1.8em;gap:6px;align-items:center;font-size:12px}
.sr .bar{height:7px;border-radius:4px;background:#e4e1d8;overflow:hidden}.sr .bar i{display:block;height:100%;background:#8a8f8a}
.sr .bar i.h{background:var(--clay)}.sr .bar i.e{background:#d4a017}
.sr em{font-style:normal;font-weight:700;text-align:right}
.card.dim{opacity:.45}
.card .tag{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px}
/* 카드 상세 */
.cd{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;margin-top:18px;align-items:start}
.cd .card{cursor:default}
.cd .card .plate b{font-size:22px}.cd .card .sr{font-size:14px;grid-template-columns:3em minmax(0,1fr) 2em}.cd .card .sr .bar{height:10px}
.pt{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px}
.pt span{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:#ece8de}
.pt span b{color:var(--clay2);margin-left:4px}
.flipb{margin-top:10px;width:100%}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--board);padding:8px;border-radius:12px;max-width:340px}
.cell{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.1);border:0;min-height:0;padding:0}
.cell.lock{background:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 5px,rgba(0,0,0,.15) 5px 10px);cursor:not-allowed}
.cell.g-C{background:#8a9a90}.cell.g-B{background:#3d8fd1}.cell.g-A{background:#b05ad6}.cell.g-S{background:#e2b23c}
.cell.fhint{outline:2px solid var(--gold)}.cell.lifting{opacity:.35}
.inv{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.blk{background:rgba(0,0,0,.2);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;color:var(--ink);min-height:0;font-weight:500;text-align:left}
.blk.sel{border-color:var(--gold)}.blk[draggable=true]{cursor:grab}
.mini{display:grid;gap:2px;margin-bottom:6px}.mini i{width:12px;height:12px;border-radius:3px}
.blk small{display:block;font-size:12px}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.sum span{background:var(--board);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.apt{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.5em,1fr));gap:6px;margin-top:8px}
.apt span{background:var(--board);border-radius:8px;padding:6px;text-align:center;font-size:13px}.apt b{display:block;font:700 20px var(--fh)}
/* 경기 */
.sb{background:var(--board);border:4px solid #3c2a1c;border-radius:12px;padding:10px;overflow-x:auto}
.sb table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:520px}
.sb th,.sb td{padding:6px 4px;text-align:center;font-weight:700}
.sb th{color:var(--mute);font-size:13px}.sb td:first-child{text-align:left;white-space:nowrap}
.sb td.r{color:var(--gold);font:700 22px var(--fh)}.sb td.now{background:rgba(255,210,122,.18)}
.gm{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:center}
.gm .card{cursor:default}
.dia{width:100%;max-width:300px;display:block;margin:0 auto}
.count{display:flex;justify-content:center;gap:14px;font-weight:700;margin-top:6px}
.count i{display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18);margin-left:3px}
.count .b i.on{background:var(--ok)}.count .s i.on{background:var(--gold)}.count .o i.on{background:var(--bad)}
.log{max-height:260px;overflow:auto;background:var(--bg2);border-radius:12px;padding:10px 14px;margin-top:16px}
.log p{margin:3px 0}.log p.hit{color:var(--gold);font-weight:700}.log p.c{color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
/* 홈 */
.hub{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;margin-top:18px}
.mu{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.vs{font:700 40px var(--fh);color:var(--gold);text-align:center}
.std{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.std td,.std th{padding:6px;border-bottom:1px solid var(--line);text-align:right}.std td:nth-child(2),.std th:nth-child(2){text-align:left}
.std tr.me{background:rgba(224,122,69,.25)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
/* 오더 줄 */
.strip{display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:8px;margin-top:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px}
.sh{writing-mode:vertical-rl;font:700 20px var(--fh);color:var(--gold);display:grid;place-items:center;background:var(--board);border-radius:10px;letter-spacing:.3em}
.row{display:flex;align-items:flex-end;gap:5px;padding-bottom:4px}
.oc{flex:1 1 0;min-width:62px;max-width:96px;display:grid;gap:3px;justify-items:stretch;text-align:center}
.onum{font-size:13px;font-weight:700;color:var(--mute);min-height:1.2em}
.ocb{width:100%;padding:0;min-height:0;border-radius:9px;background:var(--paper);color:var(--pi);overflow:hidden;text-align:center;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.35);border:2px solid var(--paper)}
.ocb.sel{outline:3px solid var(--gold);outline-offset:2px}
.ocb.empty{height:122px;background:rgba(255,255,255,.08);border:2px dashed var(--line);color:var(--mute);box-shadow:none}
.oart{display:block;position:relative;aspect-ratio:1;background:var(--tc)}.oart svg{position:absolute;inset:0;width:100%;height:100%}
.oovr{position:absolute;right:4px;top:1px;display:flex;align-items:center;font:700 17px var(--fh);color:#fff;font-style:normal;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.onm{display:block;font:700 12px/1.3 var(--fb);padding:3px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osub{display:block;font-size:12px;background:var(--pi);color:#ddd;padding:1px 0}.osub.t-L{color:var(--gold)}.osub.t-S{color:#cfd6e0}
.olab{font-weight:900;font-size:14px;color:var(--mute)}.olab.sp{color:#ffb98f}.olab.rp{color:#9fd6ff}.olab.su{color:var(--gold)}.olab.cl{color:var(--bad)}
.psel{font-size:12px;min-height:32px;padding:2px 2px;width:100%;font-weight:700}
.psel.fit-A{border-color:var(--ok)}.psel.fit-B{border-color:var(--warn)}.psel.fit-C{border-color:var(--bad);color:var(--bad)}
.arr{flex:0 0 auto;align-self:center;font:700 24px var(--fh);color:var(--mute);margin-top:18px}
.gap{flex:0 0 8px;align-self:stretch;border-left:2px dashed var(--line);margin-left:4px}
.lu2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.lu2>.box{max-height:430px;overflow-y:auto}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:rgba(0,0,0,.2);color:var(--ink);min-height:40px;padding:6px 14px}.tabs button.on{background:var(--clay);color:#fff}
.bat{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;height:220px}
.bat{grid-template-columns:repeat(9,minmax(0,1fr))}.bozone{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-bottom:4px}.bozone span{font-size:11px;font-weight:700;text-align:center;background:rgba(255,255,255,.08);border-radius:4px;padding:2px 0;white-space:nowrap;overflow:hidden}
.bc2.pen .bwrap{outline:2px dashed var(--bad);outline-offset:1px}.bwrap em{position:absolute;left:0;right:0;top:2px;font:700 10px var(--fb);color:var(--bad);font-style:normal;text-align:center}.legend i.x{background:none;outline:2px dashed var(--bad)}
.tcm{grid-column:span 2}.tcl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.tcall{min-height:30px;padding:2px 10px;font-size:12px}
.tcc{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border-radius:8px;padding:3px 8px 3px 3px;font-size:12px;opacity:.6;margin:0 4px 4px 0}.tcc.on{opacity:1;outline:1px solid var(--gold)}
.tcc i{font:700 13px/20px var(--fh);font-style:normal;width:22px;text-align:center;border-radius:5px}.tcc.g-S i{background:linear-gradient(135deg,#fff0b3,#d4a017);color:#3a2405}.tcc.g-A i{background:#c22a2a;color:#fff}.tcc.g-B i{background:#2f6fb0;color:#fff}

.fx-EX::after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:fxsweep 3.2s ease-in-out infinite}

.fx-GG{background:radial-gradient(circle at 20% 30%,rgba(255,240,170,.7) 0 1.5px,transparent 2px),radial-gradient(circle at 75% 20%,rgba(255,240,170,.7) 0 1.5px,transparent 2px),radial-gradient(circle at 60% 65%,rgba(255,240,170,.6) 0 1.2px,transparent 1.8px),linear-gradient(160deg,rgba(47,184,119,.22),transparent 45%,rgba(255,210,122,.25));mix-blend-mode:screen;animation:fxtw 2.8s ease-in-out infinite}

#hdr .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;margin:0;max-width:min(92vw,680px);box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none;animation:tst 6s forwards}@keyframes tst{0%,85%{opacity:1}100%{opacity:0}}

.abmw{overflow-x:auto;margin-top:12px;border-radius:14px}.abmap{position:relative;aspect-ratio:960/416;min-width:620px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#13407a,#0a1f45 75%);border:1px solid rgba(140,190,255,.25)}

.abpin:hover span{border-color:#fff}
.abl{grid-template-columns:minmax(0,1fr)!important;margin-bottom:14px}.abmw{max-width:1000px;margin-left:auto;margin-right:auto}

.numart b{position:relative;z-index:1;font:700 clamp(20px,min(40cqw,52cqh),110px) var(--fh);line-height:1;color:#fff;-webkit-text-stroke:2px color-mix(in srgb,var(--tc) 45%,#000);text-shadow:3px 3px 0 rgba(0,0,0,.35);margin-bottom:6%}
.numart.nopos b{font-size:clamp(16px,min(28cqw,40cqh),76px)}
.numart small{position:absolute;z-index:2;top:6%;left:7%;font:700 clamp(8px,min(9cqw,11cqh),15px) var(--fb);color:rgba(255,255,255,.9);letter-spacing:.04em}
.oart,.cv,.cart,.fig{container-type:size}

.lg details.gl{border-top:1px solid rgba(255,255,255,.1);padding:2px 0}.lg details.gl:first-of-type{border-top:0}

.lg details.gl>summary b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--clay2,#c55);color:#fff;font-size:12px}
.lg details.gl[open]{background:rgba(0,0,0,.18);border-radius:10px;padding:2px 8px 10px}
.lg details.gl .tbl{font-size:12.5px;margin-top:8px}.lg .tbl.ls td,.lg .tbl.ls th{padding:4px 6px;text-align:center}
.lg details.gl .glog{max-height:220px;overflow:auto;font-size:13px;margin:8px 0 0;padding-left:20px}
.lg .band h3 small{font:500 12px var(--fb);color:var(--mute);margin-left:6px}
.lg .band>details>summary{cursor:pointer;padding:4px 0}
.stars.sn{letter-spacing:0;font-weight:700;font-family:var(--fb)}
.lg .warn a{color:var(--gold)}
.pw{position:relative}.pw .dupn{position:absolute;left:6px;bottom:6px;z-index:3;background:var(--gold);color:#111;font:700 12px var(--fb);padding:1px 7px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lul{font-size:13px;white-space:nowrap}.lul tbody tr{cursor:pointer}.lul tbody tr:hover{background:rgba(255,255,255,.08)}.lul tr.use{opacity:.55}.lul td,.lul th{padding:5px 7px;text-align:center}.lul .l{text-align:left}.lul small{color:var(--gold)}
.lg details.gl,.lg .band>details{display:block;width:100%}
.mrec{background:rgba(0,0,0,.2);border-radius:10px;padding:8px 12px;margin:6px 0 10px;font-size:13px}.mrec ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px}.mrec li span{display:inline-block;min-width:74px;color:var(--mute)}.mrec b{color:var(--gold)}
.presets{margin-top:14px;padding:10px 14px}.presets .tools{flex-wrap:wrap;gap:6px;align-items:center}.presets .mdk{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin-right:10px}.presets .bad{color:var(--bad,#f77)}
.lul td.mute{color:var(--mute)}
.setb summary{cursor:pointer;padding:4px 0}.setb textarea{background:rgba(0,0,0,.25);color:var(--ink,#eee);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px;font-size:12px}
button.danger{color:#ff9a8a;border-color:rgba(255,120,100,.5)}
.syn.sticky{position:sticky;top:0;z-index:6;padding:10px 12px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.syn.sticky .sslots{gap:6px}.syn.sticky .plus{font-size:16px}
.ss.sm{width:120px;min-height:0;display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;gap:0 8px;place-items:center start;padding:6px;background:rgba(0,0,0,.2);text-align:left}
.ss.sm .oart{grid-row:1/3;width:40px;height:40px;border-radius:8px;overflow:hidden;position:relative}.ss.sm b{font-size:13px}.ss.sm small{font-size:10.5px;color:var(--mute)}
.syn.sticky .ss.empty{width:120px;min-height:52px}.syn.sticky .ss.res{width:150px;min-height:52px;padding:6px}.syn.sticky .ss.res .got .card{max-width:130px}
.syn.sticky .tools{margin-top:8px!important}.syn.sticky .tools button{padding:6px 12px}
.synl tr.on{background:rgba(240,190,60,.18)}.synl .lockt{padding:2px 6px;min-height:0}
@media(max-width:600px){.ss.sm,.syn.sticky .ss.empty{width:96px}.ss.sm{grid-template-columns:1fr}.ss.sm .oart{display:none}}
.syn.sticky{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px}.syn.sticky>.tools{margin-top:0!important}
.syn.sticky .ss.res b{font:700 12.5px/1.35 var(--fb)}.syn.sticky .ss.res small{font-size:11px}
.syn.sticky [data-synex]{padding:3px 8px;font-size:12px;min-height:0}.syn.sticky>p{width:100%;margin:0}
.tbl.synl,.tbl.lul{width:100%}
.phup{display:inline-block;cursor:pointer;color:var(--gold);text-decoration:underline}.phrm{padding:2px 8px;min-height:0;font-size:12px}
.fxpick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.fxg{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);padding:4px 8px;border-radius:6px}.fxg i{font:700 16px var(--fh);font-style:normal;width:22px;text-align:center}.fxg.g-S i{color:#f0c040}.fxg.g-A i{color:#e07a45}.fxg.g-B i{color:#9cc}.fxg select{max-width:320px}
.bsum{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:14px}.bsum b{font-size:16px}.bsum b.bad{color:var(--bad,#f77)}
.bld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:10px;align-items:start}@media(max-width:900px){.bld{grid-template-columns:minmax(0,1fr)}}
.bslots{width:100%;font-size:13px}.bslots td,.bslots th{padding:4px 6px;text-align:center}.bslots .l{text-align:left}.bslots tr{cursor:pointer}.bslots tr.sel{background:rgba(240,190,60,.22);outline:2px solid var(--gold)}.bslots tr.noown td{color:#c9d3cc}.bslots .mute,.bpool .mute{color:var(--mute)}.bslots .bx{padding:0 8px;min-height:0}
.bf{flex-wrap:wrap;gap:6px;margin-bottom:6px}.bf select{max-width:130px}.bpool{max-height:none}
/* 덜 '템플릿' 같은 인상: 둥근 알약 모양·큰 라운드 줄이기 */
button,.pill,.chip,.wallet>*,.tabs button,.subnav button,.subnav2 a,#nav a,select,input,.fxc,.tcc,.pchip,.pred button,.dupn{border-radius:5px!important}
.band,.box,.deck .meter,.syn,.presets,.mrec,.abmap,.abmw,.card,.oart,.modal .mbox,#hdr,#view>.band,#view>.lg>.band,#view>.lg>.hero,#view>.lg>section.board{border-radius:8px!important}
.bf label input{width:auto;height:auto}

/* icon pass: condition bars, square badges */
.lockb{border-radius:4px;width:20px;height:20px}
.qbtn{border-radius:5px;width:36px;min-height:36px;font-size:18px}

/* ===== 업무 모드 (` 키) ===== */
body.xl{--bg:#fff;--bg2:#fff;--board:#fff;--ink:#222;--mute:#666;--clay:#217346;--clay2:#185c37;--line:#d4d4d4;--gold:#222;--ok:#107c10;--warn:#9c5700;--bad:#c00;--fh:"Malgun Gothic","맑은 고딕",Calibri,Arial,sans-serif;--fb:"Malgun Gothic","맑은 고딕",Calibri,Arial,sans-serif;background:#fff!important;background-image:linear-gradient(#e1e1e1 1px,transparent 1px),linear-gradient(90deg,#e1e1e1 1px,transparent 1px)!important;background-size:72px 22px!important;color:#222;font-size:12px;line-height:1.4}
body.xl .bgl{display:none}
body.xl *{text-shadow:none!important;box-shadow:none!important;border-radius:0!important;animation:none!important;transition:none!important;letter-spacing:normal!important;-webkit-text-stroke:0!important}
body.xl *:not(.xlbar):not(.xlbar *){background-image:none!important}
body.xl img,body.xl .fxo,body.xl .numart,body.xl .art svg:not(.lki),body.xl .tart,body.xl .abmap,body.xl .plb,body.xl .oplb{display:none!important}
body.xl h1,body.xl h2,body.xl h3,body.xl .logo{font-size:14px!important;font-weight:700;color:#222!important;margin:0 0 6px}
body.xl .logo small{font-size:11px;color:#666}
body.xl section,body.xl .band,body.xl .box,body.xl .panel,body.xl header.top,body.xl .syn,body.xl .presets,body.xl .setb,body.xl .modal .mbox{background:#fff!important;border:1px solid #d4d4d4!important;color:#222!important;padding:6px!important;margin-bottom:6px!important}
body.xl button,body.xl nav a,body.xl .subnav2 a,body.xl .tabs button,body.xl .pill,body.xl .wallet>*,body.xl select,body.xl input{font:12px var(--fb)!important;min-height:22px!important;height:auto;padding:1px 8px!important;background:#f3f3f3!important;color:#222!important;border:1px solid #c6c6c6!important;text-decoration:none}
body.xl button.on,body.xl nav a.on,body.xl .subnav2 a.on,body.xl .tabs button.on,body.xl button[aria-selected="true"]{background:#fff!important;border-color:#217346!important;border-bottom:2px solid #217346!important;color:#217346!important;font-weight:700!important}
body.xl .toast{background:#fff4ce!important;color:#222!important;border:1px solid #e0c060!important;font-size:12px!important;padding:3px 8px!important}
body.xl table{border-collapse:collapse!important;font:12px var(--fb)!important;background:#fff}
body.xl th,body.xl td{border:1px solid #d4d4d4!important;padding:1px 6px!important;background:#fff!important;color:#222!important;font:12px var(--fb)!important;height:20px}
body.xl th{background:#f3f3f3!important;font-weight:700!important}
body.xl tr.on td{background:#e6f2ea!important}body.xl tr.use td{color:#888!important}
/* 카드 그리드 → 셀 */
body.xl .pool,body.xl .mpool,body.xl .grid,body.xl .dexg{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important;gap:0!important;border-top:1px solid #d4d4d4;border-left:1px solid #d4d4d4}
body.xl .card,body.xl .oc,body.xl .tcd,body.xl .scd,body.xl .blk,body.xl .dexc,body.xl .slot,body.xl .mp{background:#fff!important;color:#222!important;border:0!important;border-right:1px solid #d4d4d4!important;border-bottom:1px solid #d4d4d4!important;outline:0!important;filter:none!important;min-height:0!important;height:auto!important;aspect-ratio:auto!important;transform:none!important;width:auto!important}
body.xl .card .art,body.xl .oart{position:static!important;height:auto!important;min-height:0!important;background:none!important;display:flex!important;gap:4px;padding:0 4px!important;aspect-ratio:auto!important}
body.xl .card *,body.xl .oc *,body.xl .tcd *,body.xl .scd *,body.xl .dexc *,body.xl .slot *{position:static!important;color:#222!important;background:transparent!important;font-size:12px!important;font-weight:400!important;font-family:var(--fb)!important;border:0!important;padding:0!important;margin:0!important;writing-mode:horizontal-tb!important}
body.xl .card .ovr,body.xl .oovr{font-weight:700!important}
body.xl .lki{color:#555!important}
body.xl .lockb,body.xl .vb,body.xl .ovb,body.xl .sbadge,body.xl span.use{display:inline!important;border:0!important;font-size:11px!important;color:#666!important;background:none!important}
body.xl .stars,body.xl .ost{color:#666!important}
body.xl svg.lch text{fill:#222!important}body.xl svg.lch rect{fill:#f3f3f3!important}body.xl svg.lch circle{fill:#217346!important}body.xl svg.lch path,body.xl svg.lch polyline{stroke:#217346!important}
body.xl .modal{background:rgba(0,0,0,.15)!important}
body.xl a{color:#0563c1}
/* 상단 리본·수식줄 */
.xlbar{flex:0 0 100%;width:100%;order:-1;margin:0 0 4px;font:12px var(--fb);color:#222;user-select:none}
.xlt{background:#217346;color:#fff;padding:4px 10px;font-size:12px;display:flex;gap:10px}.xlt span{opacity:.75}
.xlr{display:flex;gap:0;background:#f3f3f3;border-bottom:1px solid #d4d4d4;padding:0 6px;overflow:hidden;white-space:nowrap}.xlr i{font-style:normal;padding:4px 10px}.xlr i.on{border-bottom:2px solid #217346;color:#217346;font-weight:700}
.xlf{display:flex;align-items:center;border-bottom:1px solid #d4d4d4;background:#fff}.xlf b{width:60px;padding:2px 6px;border-right:1px solid #d4d4d4;font-weight:400}.xlf i{padding:2px 10px;color:#888;border-right:1px solid #d4d4d4;font-style:italic}.xlf span{padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xlc{display:grid;grid-template-columns:32px repeat(14,1fr);background:#f3f3f3;border-bottom:1px solid #d4d4d4}.xlc i{font-style:normal;text-align:center;border-right:1px solid #d4d4d4;color:#555;font-size:11px}

<script>

function seasonAwards(mode,tier,a,repeat){a=a||{};const m=(mode==='league'?tierMul(tier):1)*(repeat?.5:1),L=[];

// 경기 예측(경기 전 목표 3개 제시, 경기 끝나고 달성한 만큼 지급. 포인트를 걸지는 않음)
// [키, 이름, 기준, 기본 P]. box = 내 팀 기준 {r:득점, h:안타, hr:홈런, k:내 투수 탈삼진, ra:실점, sb:도루}

const PRED=[['r','득점 6점 이상',6,150],['h','안타 12개 이상',12,210],['hr','홈런 2개 이상',2,135],['k','탈삼진 8개 이상',8,180],
  ['sb','도루 1개 이상',1,240],['ra0','무실점 승리',0,750],['bw','5점 차 이상 승리',5,300]]; // 7개 중 1개를 골라 거는 방식 → 금액 ≈ 60P ÷ 달성률 (4,000경기 시뮬: 득점6+ 41%, 안타12+ 28%, 홈런2+ 41%, 무실점승 4.3%, 5점차승 18.5%, 탈삼진8+ 34%, 도루1+ 22%. 도루는 발야구 감독이면 쉬워져 80으로 낮게)

function predOffer(mode,tier){const m=mode==='league'?tierMul(tier):1,L=PRED.slice();for(let i=L.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[L[i],L[j]]=[L[j],L[i]]}

  const hit=(offer||[]).filter(o=>ok(o[0]));return {pt:hit.reduce((s,o)=>s+o[2],0),hit:hit.map(o=>o[1])}}
const yearGame=res=>({pt:{w:25,d:12,l:8}[res]|0}); // 연도 리그 경기당(정규·포스트시즌 공통). 144경기·하루 약 60경기 기준 하루 약 1,100P → 상한 1,500P 안

// ── 2. 뽑기 상품 ─────────────────────────────────────────────

const W=[0,30,22,18,12,8,5,3,1.6,.8,.35];
const PACKS=[
 {k:'n', n:'일반 팩',     p:500, cnt:5,d:'5장 · 전체 무작위 · 1장은 3코스트 이상'},
 {k:'c1',n:'1코스트 팩',  p:200, cnt:5,d:'5장 · 1코스트 카드만 · 합성 재료·도감 채우기용 · 10팩 안에 1코 올스타 확정'},
 {k:'p', n:'프리미엄 팩', p:1800,cnt:5,d:'5장 · 6코스트 이상 · 1장은 7코 이상 · 10팩 안에 레전드(9+) 확정'},
 {k:'t', n:'구단 묶음 팩', p:800, cnt:5,d:'5장 · 고른 구단 계보 3개 · 1장은 3코스트 이상'},
 {k:'y', n:'연도 묶음 팩', p:800, cnt:5,d:'5장 · 고른 연도 3개 · 1장은 3코스트 이상'},
 {k:'sx',n:'스타 이벤트 팩',p:2000,cnt:5,d:'5장 · 4코스트 이상 · 장마다 골든글러브·올스타·커리어하이 25% · 1장은 특별 카드 확정'},
 {k:'tl',n:'구단 팩',     p:600, cnt:5,d:'5장 · 고른 구단 계보 1개, 연도 상관없이 · 1장은 3코스트 이상'},
 {k:'ty',n:'팀 팩',       p:1000,cnt:3,d:'3장 · 고른 구단의 연도 3개 · 1장은 도감에 없는 그 팀 주전 확정'},
 {k:'b', n:'블록 팩',     p:400, cnt:3,d:'스킬 블록 3개 (C50/B30/A15/S5) · 1개는 B급 이상'},
 {k:'tc',n:'작전 카드 팩',p:600, cnt:3,d:'작전 카드 3장 (일반75/특수20/황금5) · 1장은 특수 이상'},
 {k:'t1',n:'작전 카드 1장',p:100,cnt:1,d:'작전 카드 1장'},
 {k:'sp',n:'서포트 카드 팩',p:500,cnt:3,d:'서포트 카드 3장'}];
// 천장: 팩 k를 연속 n팩 열 동안 조건(f)에 맞는 결과가 없으면 n번째 팩 하나를 확정으로 바꿈. 확정이 나오면(자연이든 천장이든) 카운트 0
// 카드 팩은 buyCards가 처리. 블록·작전·서포트 팩은 UI가 뽑은 뒤 pityTick(S,k,hit) 호출 → true면 결과 하나를 확정 등급으로 바꿀 것
const isSp=c=>c.v==='GG'||c.v==='AS'||c.v==='CH';
const PITY={p:{n:10,label:'레전드(9+)',f:c=>c.cost>=9},n:{n:10,label:'스타(6+)',f:c=>c.cost>=6},c1:{n:10,label:'1코 올스타',f:isSp},
  t:{n:10,label:'7코스트 이상',f:c=>c.cost>=7},y:{n:10,label:'7코스트 이상',f:c=>c.cost>=7},tl:{n:10,label:'7코스트 이상',f:c=>c.cost>=7},ty:{n:10,label:'7코스트 이상',f:c=>c.cost>=7},
  sx:{n:10,label:'9코 이상 특별 카드',f:c=>c.cost>=9&&isSp(c)},b:{n:10,label:'S급 블록'},tc:{n:10,label:'황금 작전'},t1:{n:30,label:'황금 작전'},sp:{n:10,label:'강화(+) 서포트'}};
function pityTick(S,k,hit){const P=PITY[k];if(!P)return false;S.pity=S.pity||{};if(hit){S.pity[k]=0;return false}
  const n=(S.pity[k]|0)+1;if(n>=P.n){S.pity[k]=0;return true}S.pity[k]=n;return false}
// 작전 카드 팩 등급(일반75/특수20/황금5), 3장 중 1장은 특수 이상 보장. 반환 등급 배열 → 해당 등급 TCARDS에서 뽑기
function tcGrades(n){n=n||3;const g=()=>{const u=rnd();return u<.05?'황금':u<.25?'특수':'일반'};const o=[];for(let i=0;i<n;i++)o.push(g());if(o.every(x=>x==='일반'))o[n-1]=rnd()<.2?'황금':'특수';return o}
const FLOOR={n:3,t:3,y:3,tl:3,p:7};
// 블록 팩 등급(C50/B30/A15/S5), 3개 중 1개는 B 이상 보장. 반환 등급 배열 → mkBlock(t,g)에 넘김
function blockGrades(n){n=n||3;const g=()=>{const u=rnd();return u<.05?'S':u<.2?'A':u<.5?'B':'C'};const o=[];for(let i=0;i<n;i++)o.push(g());if(o.every(x=>x==='C')){const u=rnd();o[n-1]=u<.1?'S':u<.4?'A':'B'}return o}  // 프리미엄 팩 연속 20팩 동안 레전드가 없으면 그 팩 마지막 장은 레전드
// 확정권: 뽑기 한 번을 공짜로/확정으로
const TIX={ch:'커리어하이 카드 1장(연도 지정 가능)',prem:'프리미엄 팩 1개',block:'블록 팩 1개(1장 이상 A급)',star:'스타(6+) 카드 1장',gg:'골든글러브 카드 1장(연도 지정 가능)',
  ex:'EX 카드 1장(구단 지정 가능)',legend:'레전드(9+) 카드 1장',abr:'유학 초기화권',pick:'레전드 선택권(원하는 9+ 카드 1장)'};
for(const p of PACKS)TIX['pk_'+p.k]=p.n+' 1개'; // 공지 보상용 팩 개봉권(SJ 2026-11-26)
const tixPool={ch:c=>c.v==='CH',star:c=>c.cost>=6&&!c.mx,gg:c=>c.v==='GG',ex:c=>c.v==='EX'&&!c.mx,legend:c=>c.cost>=9&&!c.mx};
// 중복 분해: 남는 카드 1장 → 코스트×30P (합성·유학 재료로 쓰지 않을 때)
const DISMANTLE=30;

function wpick(pool){const tot=pool.reduce((s,c)=>s+W[c.cost],0);let u=rnd()*tot;for(const c of pool)if((u-=W[c.cost])<0)return c;return pool[pool.length-1]}
function poolOf(CARDS,pk,opt){opt=opt||{};let pool=CARDS.filter(c=>c.v!=='EX'&&c.v!=='RN'&&!c.mx); // 영구결번(RN·mx)은 미션 전용 // EX는 팩에서 안 나옴(확정권·도감 전용). 올스타(AS)·GG는 일반 확률로 섞임
  if(pk.k==='p')pool=pool.filter(c=>c.cost>=6); // SJ 2026-11-26: 프리미엄=고코스트 팩
  if(pk.k==='c1')pool=pool.filter(c=>c.cost===1);
  const arr=(a,b)=>(Array.isArray(a)?a:a!=null?[a]:b!=null?[b]:[]).slice(0,3);
  if(pk.k==='t'){const L=arr(opt.lines,opt.line);pool=pool.filter(c=>L.includes(c.line))}
  if(pk.k==='y'){const Y=arr(opt.years,opt.year).map(Number);pool=pool.filter(c=>Y.includes(c.year))}
  if(pk.k==='sx')pool=pool.filter(c=>c.cost>=4);
  if(pk.k==='tl')pool=pool.filter(c=>c.line===opt.line);
  if(pk.k==='ty'){const Y=(opt.tyYears||[]).map(Number);pool=pool.filter(c=>c.line===opt.line&&Y.includes(c.year))}
  return pool}
// 카드 팩 뽑기: 포인트 차감 + 천장 + 도감 등록까지. 반환 {cards, dex(새로 완성된 세트), err}
function buyCards(S,CARDS,k,opt){const pk=PACKS.find(p=>p.k===k);if(!pk||!['n','c1','p','t','y','tl','ty','sx'].includes(k))return {err:'카드 팩 아님'};
  opt=opt||{};const sel=k==='t'?(opt.lines||[]):k==='y'?(opt.years||[]):null;if(sel&&new Set(sel.map(String)).size!==3)return {err:'3개 선택'};
  if(k==='tl'&&!opt.line)return {err:'구단 선택'};if(k==='ty'&&(!opt.line||new Set((opt.tyYears||[]).map(String)).size!==3))return {err:'구단 1개 · 연도 3개 선택'};
  if(S.pt<pk.p)return {err:'포인트가 모자라요'};const pool=poolOf(CARDS,pk,opt);if(!pool.length)return {err:'뽑을 카드 없음'};
  S.pt-=pk.p;const out=[];const sp=k==='sx'?pool.filter(isSp):null,nsp=sp&&pool.filter(c=>!c.v);
  for(let i=0;i<pk.cnt;i++)out.push(k==='ty'?pool[Math.floor(rnd()*pool.length)]:sp?wpick(rnd()<.25?sp:nsp):wpick(pool));
  if(sp&&!out.some(isSp))out[out.length-1]=wpick(sp);
  if(k==='ty'){const Y=opt.tyYears.map(Number),miss=SETS.filter(s=>s.kind==='team'&&s.line===opt.line&&Y.includes(s.year)).flatMap(s=>s.ids.filter(id=>!dexHas(S,id)));if(miss.length){const id=miss[Math.floor(rnd()*miss.length)];out[0]=pool.find(c=>c.id===id)||out[0]}}
  // 바닥 보장: 일반·구단·연도 팩은 3코스트 이상 1장, 프리미엄 팩은 스타(6+) 1장 (팩에 없으면 마지막 장을 바꿈)
  const fl=FLOOR[k];if(fl&&!out.some(c=>c.cost>=fl)){const fp=pool.filter(c=>c.cost>=fl);if(fp.length)out[out.length-1]=wpick(fp)}
  {const P=PITY[k];if(P&&P.f){const fp=pool.filter(P.f);if(fp.length&&pityTick(S,k,out.some(P.f)))out[out.length-1]=k==='ty'?fp[Math.floor(rnd()*fp.length)]:wpick(fp)}}
  return {cards:out,dex:gain(S,out.map(c=>c.id))}}
// 확정권 쓰기(카드형). pick은 id를 지정
// arg: pick→카드 id, gg→연도(선택), ex→구단 계보(선택)
function useTicket(S,CARDS,k,arg){const pickId=arg;if(!(S.tix&&S.tix[k]>0))return {err:'확정권 없음'};let c;
  if(k==='pick'){c=CARDS.find(x=>x.id===pickId&&x.cost>=9&&!x.mx);if(!c)return {err:'레전드(9+) 카드 선택'}}
  else if(tixPool[k]){const all=CARDS.filter(c=>tixPool[k](c)&&(arg==null||(k==='gg'&&c.year===+arg)||(k==='ex'&&c.line===arg)||(k==='ch'&&c.year===+arg)||!['gg','ex','ch'].includes(k))),nw=all.filter(x=>!dexHas(S,x.id));c=wpick(nw.length?nw:all)} // 도감에 없는 카드 우선
  else return {err:'팩형 확정권은 팩 화면에서 써요'};
  if(!c)return {err:'조건에 맞는 카드 없음'};S.tix[k]--;return {cards:[c],dex:gain(S,[c.id])}}
function dismantle(S,byId,id,n){n=n||1;const have=S.owned[id]|0;if(have-n<1)return {err:'1장은 남겨야 함'};
  S.owned[id]=have-n;if(byId[id].v==='EX'){S.exShard=(S.exShard|0)+n;let tk=0;while(S.exShard>=3){S.exShard-=3;tk++}if(tk){S.tix=S.tix||{};S.tix.ex=(S.tix.ex|0)+tk}return {shard:n,tix:tk,left:S.exShard}} // EX 중복 → EX 조각, 3개마다 EX 확정권(구단 지정 가능)
  const p=byId[id].cost*DISMANTLE*n;S.pt+=p;return {pt:p}}

// ── 3. 도감 ──────────────────────────────────────────────────
// 세트 종류
//  team: 연도·구단 주전 세트(373개) — 그 팀 OVR 상위 야수 8 + 투수 4 = 12장. 보상 Σ코스트×60P. 팀 팩은 균등 확률 + 미등록 주전 1장 확정
//  gg:   연도별 골든글러브 세트(44개) — 그 해 GG 카드 전부. 보상 Σ코스트×60P + 스타 확정권
//  ex:   구단 EX 세트(10개) — 그 구단 계보 EX 카드 전부. 보상 Σ코스트×80P + 레전드 확정권
//  meta: 세트 개수 달성(팀 세트 10/50/100/200/전부, GG 세트 10/전부)
const DEX={team:60,gg:60,ex:80};
let SETS=[],SET_BY={},IN_SETS={};
function buildSets(CARDS){SETS=[];const by=(f)=>{const m={};for(const c of CARDS){const k=f(c);if(k!=null)(m[k]=m[k]||[]).push(c)}return m};
  const ty=by(c=>c.v?null:c.year+'|'+c.team);
  for(const k in ty){const L=ty[k],top=(t,n)=>L.filter(c=>c.type===t).sort((a,b)=>b.ovr-a.ovr).slice(0,n);const ids=[...top('B',8),...top('P',4)];
    const [y,t]=k.split('|');SETS.push({id:'team:'+k,kind:'team',name:`${y} ${t} 주전`,year:+y,line:L[0].line,ids:ids.map(c=>c.id),rw:{pt:ids.reduce((s,c)=>s+c.cost,0)*DEX.team}})}
  const gg=by(c=>c.v==='GG'?c.year:null);
  for(const y in gg){const L=gg[y];SETS.push({id:'gg:'+y,kind:'gg',name:`${y} 골든글러브`,year:+y,ids:L.map(c=>c.id),rw:{pt:L.reduce((s,c)=>s+c.cost,0)*DEX.gg,tix:{star:1}}})}
  const ex=by(c=>c.v==='EX'?c.line:null);
  for(const l in ex){const L=ex[l];SETS.push({id:'ex:'+l,kind:'ex',name:`${l} EX`,ids:L.map(c=>c.id),rw:{pt:L.reduce((s,c)=>s+c.cost,0)*DEX.ex,tix:{legend:1}}})}
  const chs=by(c=>c.v==='CH'?c.line:null);
  for(const l in chs){const L=chs[l];SETS.push({id:'ch:'+l,kind:'ch',name:`${l} 커리어하이`,line:l,ids:L.map(c=>c.id),rw:{pt:L.reduce((s,c)=>s+c.cost,0)*DEX.gg,tix:{legend:1}}})}
  const nT=SETS.filter(s=>s.kind==='team').length,nG=SETS.filter(s=>s.kind==='gg').length;
  for(const [n,rw] of [[10,{pt:3000,tix:{prem:2}}],[50,{pt:10000,tix:{gg:1}}],[100,{pt:20000,tix:{legend:1}}],[200,{pt:40000,tix:{ex:1}}],[nT,{pt:80000,tix:{pick:2}}]])
    SETS.push({id:'meta:team'+n,kind:'meta',name:n===nT?'팀 세트 전부':`팀 세트 ${n}개`,need:['team',n],rw});
  for(const [n,rw] of [[10,{pt:10000,tix:{legend:1}}],[nG,{pt:50000,tix:{pick:1}}]])
    SETS.push({id:'meta:gg'+n,kind:'meta',name:n===nG?'GG 세트 전부':`GG 세트 ${n}개`,need:['gg',n],rw});
  SET_BY={};IN_SETS={};for(const s of SETS){SET_BY[s.id]=s;for(const id of s.ids||[])(IN_SETS[id]=IN_SETS[id]||[]).push(s.id)}
  return SETS}
const dexHas=(S,id)=>!!(S.dex&&S.dex[id]);
function setProgress(S,s){if(s.kind==='meta'){const n=SETS.filter(x=>x.kind===s.need[0]&&S.dexDone[x.id]).length;return {have:Math.min(n,s.need[1]),need:s.need[1]}}
  return {have:s.ids.filter(id=>dexHas(S,id)).length,need:s.ids.length}}
// 카드 획득(보유+도감 등록). 새로 완성된 세트 보상을 자동 지급하고 목록을 돌려줌
function gain(S,ids){S.dex=S.dex||{};S.dexDone=S.dexDone||{};const touched=new Set();
  for(const id of ids){const dup=S.owned[id]|0;S.owned[id]=dup+1;if(!dup&&S.cond)S.cond[id]=S.cond[id]||3;
    if(!S.dex[id]){S.dex[id]=1;for(const sid of IN_SETS[id]||[])touched.add(sid)}}
  const done=[];const check=s=>{if(S.dexDone[s.id])return;const p=setProgress(S,s);if(p.have>=p.need){S.dexDone[s.id]=Date.now();grant(S,s.rw);done.push(s)}};
  for(const sid of touched)check(SET_BY[sid]);if(done.length)for(const s of SETS)if(s.kind==='meta')check(s);
  return done}


// 출석·일일 미션 (현질 대신 꾸준히 들어오면 목돈이 생기게). 날짜는 기기 현지 날짜 'YYYY-MM-DD'
const DAILY={login:200,streak7:{tix:{prem:1,abr:1}},missions:[['g3','아무 경기 3판',3,100],['w1','AI 리그 1승',1,100],['p1','카드 팩 1개 열기',1,100]]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function login(S,day){day=day||today();S.daily=S.daily||{};const D=S.daily;if(D.day===day)return null;
  const prev=D.day?Math.round((new Date(day)-new Date(D.day))/864e5):0;D.streak=prev===1?(D.streak|0)+1:1;D.day=day;D.m={};D.got={};
  const rw={pt:DAILY.login,tix:{}};if(D.streak%7===0)rw.tix={...DAILY.streak7.tix};grant(S,rw);return {...rw,streak:D.streak}}
// 미션 진행: ev = 'g3'|'w1'|'p1'. 달성 순간 보상 지급 후 보상 반환
function mission(S,ev){const D=S.daily;if(!D||!D.m)return null;const m=DAILY.missions.find(x=>x[0]===ev);if(!m||D.got[ev])return null;
  D.m[ev]=(D.m[ev]|0)+1;if(D.m[ev]>=m[2]){D.got[ev]=1;const rw={pt:m[3]};grant(S,rw);return rw}return null}

// 반복 보상 일일 상한: 결과만 보기로 무한히 벌지 못하게. 연도 리그 경기·재우승, 단일팀 반복 클리어 P는 하루 합계 CAP까지만.
// 첫 우승·첫 클리어·주간 리그(주 27경기 고정)·도감·출석은 상한 밖. 사용: rw=ECON.capped(S,ECON.yearGame(res)) 후 grant
const CAP={day:1500};
function capped(S,rw){const d=today();S.rep=S.rep&&S.rep.day===d?S.rep:{day:d,pt:0};const left=Math.max(0,CAP.day-S.rep.pt),pt=Math.min(left,rw.pt|0);
  S.rep.pt+=pt;return {...rw,pt,capped:pt<(rw.pt|0),left:left-pt}}
// 유학: 하이리스크 하이리턴. 유학지 표는 UI 시안 ABD/ABR과 같음(이 표가 기준). 좋은 곳일수록 비싸고 실패가 잦고 대성공이 큼
// [id, 시간h, 비용배율, [대성공,성공,보통,실패]%, [대성공,성공,보통 상승치]]. 실패면 상승 0, 비용·중복 재료는 소모
// 비용 = 500 × 시간^0.6 × 비용배율 × (1 + 코스트/5), 10P 단위. 조기 귀국은 남은 1시간당 500P
const STUDY=[['d1',2,1,[10,50,40,0],[4,3,2]],['d6',3,1.25,[12,45,38,5],[5,3,2]],['d2',4,1.5,[12,43,35,10],[6,4,2]],
  ['d8',6,1.75,[14,38,33,15],[7,4,2]],['d3',8,2,[15,35,30,20],[8,5,2]],['d7',10,2.25,[17,30,28,25],[10,6,3]],['d9',10,2.25,[17,30,28,25],[10,6,3]],
  ['d4',12,2.5,[18,25,27,30],[12,7,3]],['d5',24,3,[20,20,20,40],[15,9,4]]];
const STUDY_BY=Object.fromEntries(STUDY.map(x=>[x[0],x])),RUSH=500;
const studyFee=(d,cost)=>{const x=STUDY_BY[d]||STUDY[0];return Math.round(500*Math.pow(x[1],.6)*x[2]*(1+(cost||0)/5)/10)*10};
// 저코스트 보정(SJ 2026-11-26): 코스트 5 이하는 (6-코스트)×3%p를 실패→보통 순으로 빼서 대성공·성공에 반씩 더함(1코 +15%p)
function studyOdds(d,cost){const x=STUDY_BY[d]||STUDY[0],p=x[3].slice();let m=Math.max(0,6-(cost||6))*3;const t=m;for(const i of [3,2]){const k=Math.min(p[i],m);p[i]-=k;m-=k}const g=t-m;p[0]+=Math.ceil(g/2);p[1]+=Math.floor(g/2);return p}
function studyRoll(d,cost){const x=STUDY_BY[d]||STUDY[0],N=['대성공','성공','보통','실패'],P=studyOdds(d,cost);let u=rnd()*100;
  for(let i=0;i<4;i++)if((u-=P[i])<0)return {name:N[i],gain:i<3?x[4][i]:0};return {name:'실패',gain:0}}
// 유학 가능 여부(경제 쪽 검사): 특수 카드(올스타·골글·EX)는 불가. 나이 조건 등은 UI/엔진에서 추가 검사
const abResetFee=cost=>Math.round(3000*(1+(cost||0)/5)/100)*100; // 유학 초기화 비용(SJ 2026-11-25: 포인트나 초기화권으로 지우고 다시 보냄)
const canStudy=c=>c&&c.v?{err:'특수 카드(올스타·골든글러브·EX)는 유학 불가'}:{ok:true};
const rushFee=msLeft=>Math.max(0,Math.ceil(msLeft/36e5))*RUSH;
function pay(S,p){if((S.pt||0)<p)return {err:'포인트가 모자라요'};S.pt-=p;return {pt:p}}
// 쿠폰: Firestore coupons/{코드} 문서를 읽어 data로 넘김. 같은 코드는 한 번만(S.coupons에 기록). exp(만료 시각, ms 또는 Timestamp) 지나면 거절
function redeem(S,code,data){code=String(code||'').trim().toUpperCase();S.coupons=S.coupons||{};
  if(!data)return {err:'없는 쿠폰'};if(S.coupons[code])return {err:'이미 사용한 쿠폰'};
  const exp=data.exp&&(data.exp.toMillis?data.exp.toMillis():+data.exp);if(exp&&Date.now()>exp)return {err:'기간 만료 쿠폰'};
  const rw={pt:+data.pt||0,tix:data.tix||{}};S.coupons[code]=Date.now();grant(S,rw);return {rw,text:rwText(rw)}}
// 연도 리그 경기 예측 전용 상한: 하루 1,500P (자동 진행 하루 약 60경기 × 평균 60P = 3,600P라 상한 없으면 과함). 주간 리그 예측은 상한 없음
const PRED_CAP=1500;
function predCapped(S,rw){const d=today();S.prc=S.prc&&S.prc.day===d?S.prc:{day:d,pt:0};const left=Math.max(0,PRED_CAP-S.prc.pt),pt=Math.min(left,rw.pt|0);
  S.prc.pt+=pt;return {...rw,pt,capped:pt<(rw.pt|0),left:left-pt}}
// ── 장비(미션 보상 전용) ──────────────────────────────────────
// 카드 유형별 슬롯 3칸, 언제든 끼웠다 뺄 수 있음. 저코스트 카드일수록 보너스가 큼(덱 운영용): 전설 기준 1코 +20 … 5코 +10 … 10코 +2
// 등급 배율: 일반 0.35 · 희귀 0.6 · 전설 1. 같은 구단 장비를 그 구단 카드에 끼우면 +10%(최소 +1). 결과는 반올림, 최소 +1
const EQ_KIND={bp:['B','bat','배트(장타)','pow'],bc:['B','bat','배트(교타)','con'],gl:['B','glove','글러브','def'],sk:['B','spike','스파이크','spd'],
  ro:['P','rosin','로진','ctl'],bl:['P','ball','공인구','stu'],sh:['P','shoe','투수화','sta']};
const EQ_SLOTS={B:['bat','glove','spike'],P:['rosin','ball','shoe']},EQ_G={일반:.35,희귀:.6,전설:1};
const EQ_BASE=[0,20,17,15,12,10,8,6,4,3,2];
function mkEquip(S,g,line,kind){const ks=Object.keys(EQ_KIND),k=kind||ks[Math.floor(rnd()*ks.length)];S.eq=S.eq||[];S.eqN=(S.eqN|0)+1;
  const it={u:'e'+S.eqN,k,g,line:line||null,on:null};S.eq.push(it);return it}
const eqName=it=>`${it.line?it.line+' ':''}${it.g} ${EQ_KIND[it.k][2]}`;
function eqBonus(it,c){const K=EQ_KIND[it.k];if(!c||c.type!==K[0])return null;let v=EQ_BASE[Math.max(1,Math.min(10,c.cost))]*EQ_G[it.g];
  if(c.v==='CH')v*=1.25; // 커리어하이 카드는 장비 ×1.25
  if(c.pz)v*=1+.25*c.pz; // 숨은 잠재력(세이버 지표 좋았던 선수) ×1.25/×1.5
  if(it.line&&it.line===c.line)v+=Math.max(1,v*.1);return {stat:K[3],v:Math.max(1,Math.round(v))}}
function equip(S,u,cardId,byId){const it=(S.eq||[]).find(x=>x.u===u),c=byId[cardId];if(!it||!c)return {err:'없는 장비·카드'};const K=EQ_KIND[it.k];
  if(c.type!==K[0])return {err:K[0]==='B'?'타자용 장비예요':'투수용 장비예요'};
  for(const x of S.eq)if(x.on===cardId&&EQ_KIND[x.k][1]===K[1]&&x!==it)x.on=null; // 같은 슬롯에 있던 장비는 빠짐
  it.on=cardId;return {ok:true,bonus:eqBonus(it,c)}}
function unequip(S,u){const it=(S.eq||[]).find(x=>x.u===u);if(it)it.on=null;return {ok:!!it}}
// 카드에 끼운 장비 합계 {stat:+v}. 엔진이 능력치에 더할 때 사용
function cardEq(S,cardId,byId){const o={},c=byId[cardId];for(const it of S.eq||[])if(it.on===cardId){const b=eqBonus(it,c);if(b)o[b.stat]=(o[b.stat]|0)+b.v}return o}
// ── 미션 챕터(OOTP식) ─────────────────────────────────────────
// 구단 계보마다 챕터 1개, 미션 ★1~★5. 미션 3개 → 그 구단 EX 확정권, 5개 → 영구결번 카드(v:'RN', mx) 1장 + 전설 장비. 챕터 재완료는 없음
// 챕터 3개 완료 → 레전드 선택권, 전부 → 명예의 전당 보상(첫 완료 기준 S.msFin). 진행 기록 S.ms[챕터id]={cyc,m1:시각,...,mid,fin}
// 제출 미션은 기본적으로 중복만 소모(1장은 남김). S.opt.submitLast=true면 마지막 1장도 제출 가능(도감 기록은 유지)
const MS_DEF=[['m1',1,'그 구단 카드 10장 보유',{pt:1000,eq:'일반'}],['m2',2,'그 구단 주전 세트 1개 완성',{pt:2000,tix:{star:1,abr:1},eq:'일반'}],
  ['m3',3,'그 구단 7코스트 이상 카드 5장 제출',{pt:3000,exShard:1,eq:'희귀'}],['m4',4,'그 구단 선수 15명 이상 1군으로 주간 리그 4단계 이상 우승',{pt:4000,tix:{gg:1},eq:'희귀'}],
  ['m5',5,'그 구단 레전드(9+) 카드 3장 보유',{pt:5000,tix:{legend:1},eq:'희귀'}]];
const MS_META=[[3,'챕터 3개 완료',{pt:10000,tix:{pick:1}}],['all','모든 챕터 완료 · 명예의 전당',{pt:50000,tix:{pick:2}}]];
let CHAPTERS=[],CARDS_=[];
function buildMissions(CARDS){CARDS_=CARDS;const L=[...new Set(CARDS.filter(c=>c.v!=='NT').map(c=>c.line))]; // 국가대표(NT)는 구단 챕터가 아님(국가대표 미션 보상)
  CHAPTERS=L.map(l=>({id:'ch:'+l,line:l,mx:CARDS.filter(c=>c.mx&&c.line===l).map(c=>c.id)}));return CHAPTERS}
// 회차: 구단에 영구결번이 여러 장이면(삼성·한화 4장 등) 챕터를 다시 돌 수 있음. 회차 c마다 조건이 올라감
const msReq=(c)=>({m1:10+5*c,m2:1+c,m3:5+3*c,m4:Math.min(10,4+2*c),m5:3+c});
const msCyc=(S,ch)=>((S.ms&&S.ms[ch.id]&&S.ms[ch.id].cyc)|0);
function msText(S,ch,mid){const q=msReq(msCyc(S,ch));return {m1:`그 구단 카드 ${q.m1}장 보유`,m2:`그 구단 주전 세트 ${q.m2}개 완성`,m3:`그 구단 7코스트 이상 카드 ${q.m3}장 제출`,
  m4:`그 구단 선수 15명 이상 1군으로 주간 리그 ${q.m4}단계 이상 우승`,m5:`그 구단 레전드(9+) 카드 ${q.m5}장 보유`}[mid]}
const ownedOf=(S,f)=>CARDS_.filter(c=>(S.owned[c.id]|0)>0&&f(c));
function msProg(S,ch,mid){const l=ch.line,st=(S.ms&&S.ms[ch.id])||{};if(st[mid])return {done:true,have:1,need:1};
  const q=msReq(st.cyc|0);
  if(mid==='m1'){const n=ownedOf(S,c=>c.line===l).length;return {have:Math.min(n,q.m1),need:q.m1}}
  if(mid==='m2'){const n=SETS.filter(s=>s.kind==='team'&&s.line===l&&S.dexDone&&S.dexDone[s.id]).length;return {have:Math.min(n,q.m2),need:q.m2}}
  if(mid==='m3'){return {have:(st.sub|0),need:q.m3}}
  if(mid==='m4')return {have:0,need:1,tier:q.m4};
  if(mid==='m5'){const n=ownedOf(S,c=>c.line===l&&c.cost>=9&&!c.mx).length;return {have:Math.min(n,q.m5),need:q.m5}}}
function msDone(S,ch,mid,out){S.ms=S.ms||{};const st=S.ms[ch.id]=S.ms[ch.id]||{};if(st[mid])return;st[mid]=Date.now();
  const rw={...MS_DEF.find(m=>m[0]===mid)[3]};if(rw.exShard){S.exShard=(S.exShard|0)+rw.exShard;while(S.exShard>=3){S.exShard-=3;rw.tix={...(rw.tix||{}),ex:((rw.tix||{}).ex|0)+1}}delete rw.exShard}
  let eqx='';if(rw.eq){const it=mkEquip(S,rw.eq,ch.line);eqx=' · 장비: '+eqName(it);delete rw.eq}
  grant(S,rw);out.push({ch:ch.line,what:msText(S,ch,mid)+(mid==='m3'?' (EX 조각 +1)':'')+eqx,rw});
  const n=MS_DEF.filter(m=>st[m[0]]).length;
  if(n>=3&&!st.mid){st.mid=Date.now();const r={tix:{ex:1}};grant(S,r);out.push({ch:ch.line,what:'미션 3개 달성',rw:r})}
  if(n>=5&&!st.fin){st.fin=Date.now();{const it=mkEquip(S,'전설',ch.line);out.push({ch:ch.line,what:'챕터 완료 · 전설 장비: '+eqName(it),rw:{}})}const miss=ch.mx.filter(id=>!(S.owned[id]>0));
    if(ch.mx.length){const id=(miss.length?miss:ch.mx)[Math.floor(rnd()*(miss.length||ch.mx.length))];gain(S,[id]);out.push({ch:ch.line,what:'챕터 완료',card:id,rw:{}})}
    else{const r={pt:10000,tix:{ex:1}};grant(S,r);out.push({ch:ch.line,what:'챕터 완료',rw:r})}
    S.msFin=S.msFin||{};if(!S.msFin[ch.id])S.msFin[ch.id]=Date.now();
    if(ch.mx.some(id=>!(S.owned[id]>0))){S.ms[ch.id]={cyc:(st.cyc|0)+1};out.push({ch:ch.line,what:`${(st.cyc|0)+2}회차 시작 (남은 영구결번 ${ch.mx.filter(id=>!(S.owned[id]>0)).length}장, 조건 상향)`,rw:{}})}
    const fin=CHAPTERS.filter(c=>S.msFin[c.id]).length;S.msMeta=S.msMeta||{};
    for(const [k,name,r] of MS_META){const need=k==='all'?CHAPTERS.length:k;if(fin>=need&&!S.msMeta[k]){S.msMeta[k]=Date.now();grant(S,r);out.push({ch:'',what:name,rw:r})}}}}
// 보유·도감 조건 미션 자동 확인(카드 얻은 뒤, 화면 열 때 호출). 새로 깬 미션 목록 반환
function missionCheck(S){const out=[];for(const ch of CHAPTERS)for(const mid of ['m1','m2','m5']){const p=msProg(S,ch,mid);if(!p.done&&p.have>=p.need)msDone(S,ch,mid,out)}return out.concat(natCheck(S))}
// 제출(★3): ids = 낼 카드 id 배열(중복 허용). 그 구단 7코+만. 기본은 중복만, S.opt.submitLast면 마지막 장도
function missionSubmit(S,line,ids){const ch=CHAPTERS.find(c=>c.line===line);if(!ch)return {err:'없는 챕터'};S.ms=S.ms||{};const st=S.ms[ch.id]=S.ms[ch.id]||{};
  if(st.m3)return {err:'이미 완료한 미션이에요'};const last=S.opt&&S.opt.submitLast,use={};
  for(const id of ids){const c=CARDS_.find(x=>x.id===id);if(!c||c.line!==line||c.cost<7)return {err:'그 구단 7코스트 이상 카드만 낼 수 있어요'};use[id]=(use[id]|0)+1}
  for(const id in use){const keep=last?0:1;if((S.owned[id]|0)-use[id]<keep)return {err:last?'가진 장수보다 많아요':'중복 카드만 낼 수 있어요 (옵션에서 마지막 1장 제출 허용 가능)'}}
  const room=msReq(st.cyc|0).m3-(st.sub|0);let n=0;for(const id in use){const k=Math.min(use[id],room-n);if(k<=0)break;S.owned[id]-=k;if(S.owned[id]<=0)delete S.owned[id];n+=k}
  st.sub=(st.sub|0)+n;const out=[];if(st.sub>=msReq(st.cyc|0).m3)msDone(S,ch,'m3',out);return {used:n,have:st.sub,out}}
// ★4: 주간 리그 우승 때 모드 쪽에서 호출. lineupCards = 1군 카드 객체 배열
function missionLeague(S,tier,lineupCards){const out=[];const cnt={};for(const c of lineupCards||[])if(c)cnt[c.line]=(cnt[c.line]|0)+1;
  for(const ch of CHAPTERS)if((cnt[ch.line]|0)>=15&&tier>=msReq(msCyc(S,ch)).m4)msDone(S,ch,'m4',out);return out}
// ── 국가대표 우승 미션 ─────────────────────────────────────────
// 대회마다 명단 선수 중 그해 기본 카드(c.v 없음)가 있는 선수 전원의 그해 카드를 1장씩 보유하면 완료(도감 아님, 보유 기준)
// 보상: 그 대회 국가대표 카드(v:'NT', mx, 미션 전용) 전부 + 5,000P. 보상 카드가 없는 대회(2018·2026)는 10,000P + 레전드 확정권
// 사용: ECON.buildNat(CARDS, NAT_SETS, natHit) — core2의 NAT_SETS·natHit를 넘김. 확인은 missionCheck가 같이 함

// ===== 친구 리그 (Firebase: Google 로그인 + Firestore) =====
// window.FB 는 Firebase 배포본의 module 스크립트가 채워 넣는다. 없으면 안내만 보여 준다.
const ON={user:null,leagues:[],cur:null,teams:{},games:[],msg:'',busy:false,sync:'',lastPush:0};
const fb=()=>window.FB;
// ===== 클라우드 저장(v2, 2026-11-25) =====
// users/{uid}            : 작은 요약 문서. v·ts·name·cards(보유 종류 수)와 콘솔에서 바로 고칠 수 있는 pt·tix·exShard·tq·sq
// users/{uid}/save/owned : {c:{카드id:장수}} 보유 카드(맵, 콘솔 편집 가능)
// users/{uid}/save/team  : {j:팀·라인업 JSON}
// users/{uid}/save/rest  : {j:나머지(스킬 블록·덱·유학·시즌 등) JSON}
// 저장: 바뀐 하위 문서만 한 번에(batch) 씀. 불러오기: 평소엔 요약 문서 1개만 읽고, 다른 기기에서 더 최근에 저장했을 때만 하위 문서 3개를 읽음
// 콘솔에서 pt 등 요약 필드를 고치면 다음 접속 때 자동 반영. 보유 카드·나머지를 콘솔에서 고쳤다면 요약 문서 ts를 더 큰 수로 바꿔 주면 반영됨
const TOPK=['pt','tix','exShard','tq','sq'],LOCALK=new Set(['photos','photoTs','phPull','cl','uid']);
const canon=v=>v&&typeof v==='object'?(Array.isArray(v)?'['+v.map(canon).join(',')+']':'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'):JSON.stringify(v===undefined?null:v);
const topOf=o=>{const t={};for(const k of TOPK)if(o[k]!=null)t[k]=o[k];return t};
function packSave(){syncTeam();const o=JSON.parse(JSON.stringify(S,function(k,v){return this===S&&(TRANS.has(k)||LOCALK.has(k))?undefined:v}));
  const owned=o.owned||{},team=o.team||{};delete o.owned;delete o.team;const top=topOf(o);for(const k of TOPK)delete o[k];delete o.ts; // ts는 요약 문서에만
  return {top,owned,os:canon(owned),team:JSON.stringify(team),rest:JSON.stringify(o)}}
const stripS=()=>{const o={...S};for(const k of LOCALK)delete o[k];return o}; // 예전 형식(json 한 덩어리) 저장용
let pushT=null;ON.last=ON.last||null; // 이 기기가 마지막으로 올린 하위 문서 내용(같으면 다시 안 씀)
function cloudPush(now){const F=fb();if(!F||!ON.user)return;clearTimeout(pushT);
  pushT=setTimeout(async()=>{try{const uid=ON.user.uid,ref=(...p)=>F.doc(F.db,'users',uid,...p);S.uid=uid;const P=packSave(),L=ON.last||{};let n=0;
    if(F.writeBatch){try{const b=F.writeBatch(F.db);
      if(L.os!==P.os){b.set(ref('save','owned'),{c:P.owned});n++}
      if(L.team!==P.team){b.set(ref('save','team'),{j:P.team});n++}
      if(L.rest!==P.rest){b.set(ref('save','rest'),{j:P.rest});n++}
      b.set(ref(),{v:2,ts:S.ts||Date.now(),name:ON.user.displayName||'',cards:Object.keys(P.owned).length,...P.top});await b.commit();
      ON.last={os:P.os,team:P.team,rest:P.rest};S.cl=canon(P.top);n=-1}
     catch(e){if(e.code!=='permission-denied')throw e;ON.v1=1}} // 규칙을 아직 안 바꿨으면 예전 형식으로
    if(n!==-1)await F.setDoc(ref(),{json:JSON.stringify(stripS()),ts:S.ts||Date.now(),name:ON.user.displayName||''});
    try{await photoSync()}catch(e){ON.sync='사진 연동 실패: '+e.code}ON.sync=ON.sync&&ON.sync.startsWith('사진')?ON.sync:'클라우드 저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+(ON.v1?' (예전 형식: 보안 규칙 게시 필요)':'');if(view()==='online')render()}catch(e){ON.sync='클라우드 저장 실패: '+e.code}},now?0:2500)}
// 직접 올린 사진(S.photos) 기기 간 연동: users/{uid}/photos/{cardId} = {d: dataURL, ts}. 본문 문서(1MB 한도)와 분리.
// S.photoTs[id]=올린 시각, S.phPull=마지막으로 클라우드 사진을 받은 시각. ON.ph=클라우드에 있다고 아는 사진(id→dataURL)
ON.ph=ON.ph||null;
async function photoSync(){const F=fb();if(!F||!ON.user||!ON.ph||!F.deleteDoc)return;S.photos=S.photos||{};S.photoTs=S.photoTs||{};const col=['users',ON.user.uid,'photos'];
  for(const id in S.photos){if(ON.ph[id]===S.photos[id])continue;const d=S.photos[id];if(d.length>190000){ON.sync='사진 용량 초과 · 연동 제외';continue}
    if(!S.photoTs[id])S.photoTs[id]=Date.now();
    await F.setDoc(F.doc(F.db,...col,id),{d,ts:S.photoTs[id]});ON.ph[id]=d}
  for(const id in ON.ph)if(!S.photos[id]){await F.deleteDoc(F.doc(F.db,...col,id));delete ON.ph[id];delete S.photoTs[id]}
  S.phPull=Date.now()} // 여기까지 올린 사진은 클라우드와 맞춰짐
async function photoPull(){const F=fb();S.photos=S.photos||{};S.photoTs=S.photoTs||{};const last=S.phPull||0,got={};
  const qs=await F.getDocs(F.collection(F.db,'users',ON.user.uid,'photos'));qs.forEach(x=>{got[x.id]=x.data()});
  for(const id in got){const c=got[id];if(!S.photos[id]||(S.photoTs[id]||0)<(c.ts||0)){S.photos[id]=c.d;S.photoTs[id]=c.ts||0}}
  // 클라우드에 없는 로컬 사진: 마지막 동기화 뒤에 올린 것만 남기고(올라갈 예정), 그 전 것은 다른 기기에서 지운 것으로 봄
  for(const id in S.photos)if(!got[id]&&last&&S.photoTs[id]&&S.photoTs[id]<=last){delete S.photos[id];delete S.photoTs[id]}
  ON.ph={};for(const id in got)if(S.photos[id]===got[id].d)ON.ph[id]=got[id].d;S.phPull=Date.now()}
function adoptCloud(o,uid){const ph=S.photos,pt=S.photoTs,pp=S.phPull;S=o;S.photos=ph;S.photoTs=pt;S.phPull=pp;S.uid=uid;
  if(typeof migSpecial==='function')migSpecial(S);for(const id in S.owned)if(!byId[id])delete S.owned[id];
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};ON.sync='클라우드 저장 불러옴';G=null;packOut=null}
async function cloudPull(){const F=fb(),u=ON.user,ref=(...p)=>F.doc(F.db,'users',u.uid,...p);try{
  const d=await F.getDoc(ref());
  if(d.exists()){const c=d.data(),newer=S.uid!==u.uid||(c.ts||0)>(S.ts||0);
    if(c.v===2&&newer){const [o,t,r]=await Promise.all([F.getDoc(ref('save','owned')),F.getDoc(ref('save','team')),F.getDoc(ref('save','rest'))]);
      const x=r.exists()?JSON.parse(r.data().j):{};x.team=t.exists()?JSON.parse(t.data().j):S.team;x.owned=o.exists()?(o.data().c||{}):{};Object.assign(x,topOf(c));x.ts=c.ts||0;
